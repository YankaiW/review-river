[project]
name = "review-river"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yankai Wang", email = "38786651+YankaiW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
review-river = "review_river:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
