[project]
name = "review-river"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yankai Wang", email = "38786651+YankaiW@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
review-river = "review_river:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100          # max characters per line (default 88 is a bit tight)
target-version = "py312"   # lets ruff suggest modern 3.12 syntax

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pyright]
include = ["src", "tests"] # what to type-check
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."             # where to find the virtualenv…
venv = ".venv"             # …so pyright sees your installed packages

[tool.pytest.ini_options]
testpaths = ["tests"]                           # where pytest looks for tests
asyncio_mode = "auto"                           # async def tests run without a decorator
asyncio_default_fixture_loop_scope = "function" # silences a pytest-asyncio warning
