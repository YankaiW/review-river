<svg xmlns="http://www.w3.org/2000/svg" width="680" height="656" viewBox="0 0 680 656" role="img"><title>Successful /classify request with the LLM backend</title><desc>From the client through validation, LLMClassifier, LLMClient and the Anthropic API to a 200 Classification.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="180" y="20" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Client: POST /classify</text><text x="340.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">JSON body with review text</text><line x1="340" y1="76" x2="340" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="100" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">FastAPI validates Review</text><text x="340.0" y="139" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">pydantic, text not empty</text><line x1="340" y1="156" x2="340" y2="178" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="180" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">get_classifier (Depends)</text><text x="340.0" y="219" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">shared client from app.state</text><line x1="340" y1="236" x2="340" y2="258" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="260" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="340.0" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">LLMClassifier → LLMClient.parse</text><text x="340.0" y="299" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">cached system + review turn</text><line x1="340" y1="316" x2="340" y2="338" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="340" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="340.0" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Anthropic API</text><text x="340.0" y="379" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">cache read, schema-shaped JSON</text><line x1="340" y1="396" x2="340" y2="418" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="420" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="340.0" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Cost + llm_call log line</text><text x="340.0" y="459" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">tokens, cost, request id</text><line x1="340" y1="476" x2="340" y2="498" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="500" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="340.0" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Checks pass → LLMLabel</text><text x="340.0" y="539" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">end_turn, confidence in [0, 1]</text><line x1="340" y1="556" x2="340" y2="578" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="580" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="340.0" y="600" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">200 Classification</text><text x="340.0" y="619" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">category, confidence; reason logged</text></g></svg>