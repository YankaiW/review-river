<svg xmlns="http://www.w3.org/2000/svg" width="680" height="548" viewBox="0 0 680 548" role="img"><title>Error flows of /classify</title><desc>Seven failure sources, what each is raised as, and what the client sees.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="140" y="22" text-anchor="middle" font-size="12" fill="#888780">Where it fails</text><text x="365" y="22" text-anchor="middle" font-size="12" fill="#888780">Raised as</text><text x="565" y="22" text-anchor="middle" font-size="12" fill="#888780">Client sees</text><rect x="40" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Empty review text</text><text x="140.0" y="79" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">request body</text><line x1="240" y1="68" x2="263" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">RequestValidationError</text><text x="365.0" y="79" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">classifier never called</text><line x1="465" y1="68" x2="488" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="570.0" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">422</text><text x="570.0" y="79" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">field error detail</text><rect x="40" y="112" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">429, 529, 5xx, timeout</text><text x="140.0" y="151" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">transient</text><line x1="240" y1="140" x2="263" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="112" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">SDK retries 2×</text><text x="365.0" y="151" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">APIError if all fail</text><line x1="465" y1="140" x2="488" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="112" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="570.0" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">503</text><text x="570.0" y="151" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Retry-After: 5</text><rect x="40" y="184" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">401, 403, 400, 404</text><text x="140.0" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">config or request</text><line x1="240" y1="212" x2="263" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="184" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">APIError, no retry</text><text x="365.0" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">sent exactly once</text><line x1="465" y1="212" x2="488" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="184" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="570.0" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">503</text><text x="570.0" y="223" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">should be 500</text><rect x="40" y="256" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Truncated JSON</text><text x="140.0" y="295" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">max_tokens mid-answer</text><line x1="240" y1="284" x2="263" y2="284" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="256" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">LLMOutputError</text><text x="365.0" y="295" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">known issue: unlogged</text><line x1="465" y1="284" x2="488" y2="284" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="256" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="570.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">503</text><text x="570.0" y="295" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Retry-After: 5</text><rect x="40" y="328" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Refusal, no text block</text><text x="140.0" y="367" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">bad stop_reason</text><line x1="240" y1="356" x2="263" y2="356" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="328" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">LLMOutputError</text><text x="365.0" y="367" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">logged, then raised</text><line x1="465" y1="356" x2="488" y2="356" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="328" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="570.0" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">503</text><text x="570.0" y="367" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Retry-After: 5</text><rect x="40" y="400" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Any other exception</text><text x="140.0" y="439" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">a bug in our code</text><line x1="240" y1="428" x2="263" y2="428" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="400" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Not handled</text><text x="365.0" y="439" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">traceback in server log</text><line x1="465" y1="428" x2="488" y2="428" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="400" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="570.0" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">500</text><text x="570.0" y="439" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">plain error body</text><rect x="40" y="472" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="140.0" y="492" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">llm backend, no key</text><text x="140.0" y="511" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">at startup</text><line x1="240" y1="500" x2="263" y2="500" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="265" y="472" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="365.0" y="492" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Settings error</text><text x="365.0" y="511" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">pydantic validation</text><line x1="465" y1="500" x2="488" y2="500" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="472" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="570.0" y="492" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">App won't start</text><text x="570.0" y="511" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">no request served</text></g></svg>